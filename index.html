<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Коч! — Найди братана в бане</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Ubuntu:wght@400;500;700&display=swap');

      :root { --ink:#21140c; --cream:#fff4d9; --orange:#ff9d3d; --red:#d9402d; --wood:#8e4b25; --steam:#fffbed; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); font-family:Ubuntu, Arial, sans-serif; background:#402616; }
      button { font:inherit; cursor:pointer; }
      .game { position:relative; min-height:100vh; isolation:isolate; background:linear-gradient(105deg, rgba(52,26,14,.38),rgba(52,26,14,.05)), repeating-linear-gradient(0deg,#b96934 0 48px,#9b5228 49px 53px), repeating-linear-gradient(90deg,transparent 0 310px,rgba(62,28,11,.42) 312px 319px); }
      .game:before { content:""; position:absolute; inset:0; z-index:-1; opacity:.7; background:radial-gradient(ellipse at 52% 35%,transparent 15%,rgba(49,20,8,.37) 86%), repeating-linear-gradient(0deg,transparent 0 51px,rgba(50,22,8,.19) 52px 55px); }
      header { height:96px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px clamp(18px,5vw,74px); border-bottom:3px solid rgba(65,31,14,.42); background:rgba(55,27,13,.2); }
      .brand { display:flex; align-items:center; gap:14px; color:#fff4d9; text-shadow:2px 3px 0 #5a2a14; }
      .brand-mark { display:grid; place-items:center; width:52px; height:52px; border-radius:50% 50% 44% 44%; background:var(--red); border:3px solid #ffe5ae; font-family:'Russo One'; font-size:24px; transform:rotate(-7deg); box-shadow:0 4px 0 #742516; }
      h1 { margin:0; font:24px 'Russo One'; letter-spacing:.4px; } .sub { margin-top:3px; font-size:13px; color:#ffd98a; }
      .stats { display:flex; gap:10px; } .pill { min-width:92px; padding:8px 13px; text-align:center; background:#fff0c8; border:2px solid #5b2a13; border-radius:12px; box-shadow:0 3px 0 #5b2a13; font-weight:700; font-size:14px; } .pill b { color:var(--red); font-size:18px; }
      .instruction { position:absolute; z-index:5; left:50%; top:116px; transform:translateX(-50%); width:min(590px,calc(100% - 32px)); text-align:center; color:#5a260e; background:#fff0c8; border:3px solid #6d3518; border-radius:15px; padding:11px 18px; box-shadow:0 5px 0 #653018; font-weight:700; }
      .instruction span { color:var(--red); font-family:'Russo One'; }
      .room { position:relative; height:calc(100vh - 96px); min-height:500px; overflow:hidden; }
      .bench { position:absolute; left:4%; right:4%; bottom:5.5%; height:29%; border:5px solid #5a2c15; border-radius:16px 16px 0 0; background:repeating-linear-gradient(0deg,#dc8645 0 40px,#b8602f 41px 46px); box-shadow:inset 0 7px rgba(255,219,149,.3), 0 16px 0 rgba(47,19,8,.48); }
      .bench:after { content:""; position:absolute; left:7%; right:7%; bottom:-49px; height:43px; background:repeating-linear-gradient(90deg,#663118 0 32px,#8e4824 34px 250px); border:4px solid #542510; }
      .stove { position:absolute; left:9%; bottom:12%; width:135px; height:165px; border-radius:62px 62px 13px 13px; background:linear-gradient(90deg,#393737,#77716b 48%,#353331); border:5px solid #241c1b; box-shadow:inset 14px 0 rgba(255,255,255,.13), 5px 8px rgba(45,18,8,.4); } .stove:before { content:""; position:absolute; top:20px; left:13px; width:99px; height:65px; border-radius:45%; background:radial-gradient(circle at 40% 30%,#c9b49a 0 6px,#75685a 7px 14px,#b0a18d 15px 20px,#60564e 21px 29px,#d1b99e 30px 35px,#665d54 36px); } .fire { position:absolute; bottom:21px; left:43px; font-size:48px; filter:drop-shadow(0 0 12px #ff992c); }
      .bucket { position:absolute; right:10%; bottom:16%; width:102px; height:83px; border:5px solid #5c371b; border-top:0; border-radius:4px 4px 22px 22px; background:repeating-linear-gradient(90deg,#dc9c53 0 17px,#bc7435 18px 23px); transform:rotate(3deg); } .bucket:before { content:""; position:absolute; left:15px; top:-47px; width:62px; height:60px; border:5px solid #603517; border-bottom:0; border-radius:50% 50% 0 0; }
      .whisk { position:absolute; right:20%; bottom:12%; width:60px; height:150px; transform:rotate(27deg); } .whisk:before { content:""; position:absolute; left:27px; top:42px; height:120px; width:8px; border-radius:9px; background:#81501e; } .leaf { position:absolute; width:31px; height:17px; background:#5d8a36; border:2px solid #345124; border-radius:100% 0 100% 0; transform:rotate(var(--r)); }
      .steam { position:absolute; opacity:.72; filter:blur(.3px); font:90px Georgia; color:var(--steam); animation:float 4s ease-in-out infinite; text-shadow:0 0 18px rgba(255,255,255,.6); } .s1{left:20%;bottom:35%;animation-delay:-1.5s}.s2{left:68%;bottom:41%;animation-delay:-.5s}.s3{left:77%;bottom:31%;animation-delay:-2.4s}@keyframes float {50%{transform:translateY(-27px) translateX(12px);opacity:.42}}
      .person { position:absolute; z-index:3; width:105px; height:180px; border:0; background:none; transition:filter .18s,transform .18s; } .person:hover,.person:focus-visible { transform:scale(1.06) rotate(-2deg); filter:brightness(1.1); outline:none; } .person .head { position:absolute; left:28px; top:13px; width:54px; height:56px; border:4px solid #4a2412; border-radius:48% 50% 43% 45%; background:#e9a26f; } .person .cap { position:absolute; left:23px; top:2px; width:64px; height:34px; border:4px solid #3d632d; border-radius:47% 53% 20% 20%; background:repeating-linear-gradient(90deg,#6f9d42 0 11px,#8bb151 12px 17px); } .person .body { position:absolute; left:20px; top:65px; width:70px; height:87px; border:4px solid #4a2412; border-radius:28px 28px 10px 10px; background:#e89c65; } .person .towel { position:absolute; left:15px; top:125px; width:80px; height:43px; border:4px solid #4a2412; border-radius:8px 8px 18px 18px; background:repeating-linear-gradient(90deg,#f5e5bf 0 12px,#d9caab 13px 17px); } .person .leg { position:absolute; top:161px; width:22px; height:22px; background:#d88d5c; border:4px solid #4a2412; border-top:0; border-radius:0 0 12px 12px; } .person .leg.one{left:25px}.person .leg.two{right:24px}
      .bro { left:49%; top:28%; } .bro .beard { display:block; position:absolute; z-index:2; left:34px; top:46px; width:42px; height:25px; background:#4d2819; border-radius:8px 8px 21px 21px; } .bro .brow { position:absolute; z-index:3; top:34px; left:38px; font-size:18px; letter-spacing:4px; } .bro .badge { display:none; position:absolute; z-index:5; left:68px; top:-45px; padding:8px 13px; color:#fff9dc; background:var(--red); border:3px solid #692116; border-radius:16px 16px 16px 2px; font:16px 'Russo One'; white-space:nowrap; transform:rotate(-4deg); box-shadow:0 3px 0 #692116; }
      .person:not(.bro) .beard,.person:not(.bro) .brow { display:none; } .p1{left:27%;top:30%;transform:scale(.86)}.p2{right:27%;top:25%;transform:scale(.92) rotate(4deg)}.p3{left:37%;bottom:24%;transform:scale(.72)}.p4{right:38%;bottom:23%;transform:scale(.72) rotate(-3deg)}
      .p2 .cap{background:repeating-linear-gradient(90deg,#917050 0 11px,#b9956c 12px 17px)} .p3 .towel{background:repeating-linear-gradient(90deg,#e55c45 0 12px,#f28a68 13px 17px)}
      .message { position:absolute; z-index:10; inset:0; display:none; place-items:center; background:rgba(43,21,10,.45); } .message.show { display:grid; } .card { width:min(430px,calc(100% - 30px)); text-align:center; padding:30px; border:4px solid #683116; border-radius:24px; background:#fff0c8; box-shadow:0 10px 0 #5d2c15; } .card h2 { margin:0 0 8px; color:var(--red); font:42px 'Russo One'; } .card p { margin:0 0 21px; font-size:18px; } .again { padding:11px 20px; border:3px solid #5d2c15; border-radius:11px; color:#fff8df; background:#cf452f; box-shadow:0 4px 0 #782517; font-weight:700; } .again:active{transform:translateY(3px);box-shadow:0 1px 0 #782517}
      @media (max-width:650px){header{height:82px;padding:10px 14px}.brand-mark{width:42px;height:42px;font-size:19px}h1{font-size:17px}.sub{display:none}.pill{min-width:auto;padding:6px 8px;font-size:12px}.instruction{top:94px;font-size:14px}.room{height:calc(100vh - 82px)}.stove{left:-14px;transform:scale(.72);transform-origin:bottom left}.bucket{right:-16px;transform:scale(.72)}.p1{left:16%}.p2{right:15%}.p3{left:24%}.p4{right:24%}.bro{left:43%;top:32%}}
    </style>
  </head>
  <body>
    <main class="game">
      <header><div class="brand"><div class="brand-mark">КОЧ</div><div><h1>Найди братана в бане</h1><div class="sub">народный квест на внимательность</div></div></div><div class="stats"><div class="pill">Время<br><b id="time">00:00</b></div><div class="pill">Лучшее<br><b id="best">—</b></div></div></header>
      <div class="instruction">Где-то здесь твой братан. Найди его — он крикнет <span>«КОЧ!»</span></div>
      <section class="room" aria-label="Парная, найдите братана"><div class="steam s1">♨</div><div class="steam s2">♨</div><div class="steam s3">♨</div><div class="stove"><div class="fire">🔥</div></div><div class="bench"></div><div class="bucket"></div><div class="whisk"><i class="leaf" style="top:2px;left:4px;--r:-10deg"></i><i class="leaf" style="top:17px;left:30px;--r:40deg"></i><i class="leaf" style="top:32px;left:0;--r:-30deg"></i><i class="leaf" style="top:47px;left:29px;--r:30deg"></i><i class="leaf" style="top:64px;left:1px;--r:-25deg"></i></div>
        <button class="person p1" aria-label="Это не братан"><i class="cap"></i><i class="head"></i><i class="body"></i><i class="towel"></i><i class="leg one"></i><i class="leg two"></i></button><button class="person p2" aria-label="Это не братан"><i class="cap"></i><i class="head"></i><i class="body"></i><i class="towel"></i><i class="leg one"></i><i class="leg two"></i></button><button class="person p3" aria-label="Это не братан"><i class="cap"></i><i class="head"></i><i class="body"></i><i class="towel"></i><i class="leg one"></i><i class="leg two"></i></button><button class="person p4" aria-label="Это не братан"><i class="cap"></i><i class="head"></i><i class="body"></i><i class="towel"></i><i class="leg one"></i><i class="leg two"></i></button>
        <button class="person bro" id="bro" aria-label="Найти братана"><i class="cap"></i><i class="head"></i><i class="brow">⌒⌒</i><i class="beard"></i><i class="body"></i><i class="towel"></i><i class="leg one"></i><i class="leg two"></i><strong class="badge">КОЧ!</strong></button>
      </section>
      <div class="message" id="message"><div class="card"><h2>КОЧ!</h2><p>Братан найден. Парилка одобряет твою зоркость!</p><button class="again" id="again">Ещё разок</button></div></div>
    </main>
    <script>
      const time = document.querySelector('#time'), best = document.querySelector('#best'), bro = document.querySelector('#bro'), message = document.querySelector('#message');
      let started = Date.now(), timer; const stored = localStorage.getItem('koch-best'); if (stored) best.textContent = stored;
      function tick(){ const s=Math.floor((Date.now()-started)/1000); time.textContent=`00:${String(s).padStart(2,'0')}`; } timer=setInterval(tick,250);
      bro.addEventListener('click',()=>{ clearInterval(timer); const s=time.textContent; bro.querySelector('.badge').style.display='block'; message.classList.add('show'); const old=localStorage.getItem('koch-best'); if(!old || s<old){localStorage.setItem('koch-best',s);best.textContent=s;} });
      document.querySelectorAll('.person:not(.bro)').forEach(p=>p.addEventListener('click',()=>{p.animate([{transform:getComputedStyle(p).transform},{transform:'translateX(6px) rotate(3deg)'},{transform:getComputedStyle(p).transform}],{duration:250})}));
      document.querySelector('#again').addEventListener('click',()=>location.reload());
    </script>
  </body>
</html>
